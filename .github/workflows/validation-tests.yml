name: Validation tests

on:
  push:
    branches:
      - main
      - 'stage/**'
  pull_request:
    branches:
      - main

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run validation edge-case tests
        run: node packages/validation/test-validation.mjs
